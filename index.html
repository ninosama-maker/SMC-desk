<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a22">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<title>SMC Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a22;--panel:#172733;--line:#2a4455;--tx:#e6eef3;--mut:#8fa6b4;--long:#3ecf9a;--short:#ff6b6b;--amb:#f2b84b}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;padding:12px 12px 40px;background:var(--bg);color:var(--tx);font:15px/1.45 Sora,system-ui,sans-serif}
button,select,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button{font-weight:600}button.go{background:var(--amb);color:#1b1405;border-color:var(--amb)}
input{width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.big{font-size:32px;font-weight:700;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid small{display:block;color:var(--mut);font-size:11.5px}.grid b{font-size:15px}
.mut{color:var(--mut);font-size:12.5px}
.pos{color:var(--long)}.neg{color:var(--short)}
.pill{display:inline-block;font-weight:700;border-radius:8px;padding:1px 9px;font-size:12.5px}
.LONG{background:var(--long);color:#05241a}.SHORT{background:var(--short);color:#2b0707}
.ord{padding:10px 0;border-top:1px solid var(--line)}
.ord:first-of-type{border-top:0}
.r1{display:flex;gap:8px;align-items:center}.r1 .pl{margin-left:auto;font-weight:700}
.st{font-size:12px;font-weight:600;color:var(--amb)}
.set{display:none;flex-direction:column;gap:8px}.set.on{display:flex}
label{font-size:12.5px;color:var(--mut)}
h2{font-size:14px;margin:0 0 6px}

body{padding-bottom:90px}
#deskbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;background:var(--amb);color:#1b1405;border-color:var(--amb);border-radius:24px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#deskpanel{position:fixed;left:0;right:0;bottom:0;height:74vh;max-width:640px;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;z-index:30;display:none;flex-direction:column;padding:12px}
#deskpanel.on{display:flex}
#cmsgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px}
.msg.user{align-self:flex-end;background:var(--amb);color:#1b1405}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.chips button{white-space:nowrap;font-size:12.5px;padding:6px 10px}
.crow{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}
.chead{display:flex;align-items:center;gap:8px}.chead b{font-size:16px}
.rec{background:var(--short);color:#2b0707;border-color:var(--short)}
.crow button{white-space:nowrap}
label input[type=checkbox]{width:auto;margin-right:8px}
.chips button.on{background:var(--amb);color:#1b1405;border-color:var(--amb)}
</style></head><body>
<div class="bar">
  <button class="go" id="start">Turn on alerts</button>
  <select id="tf"><option>5m</option><option>15m</option><option>1h</option></select>
  <button id="gear">Settings</button>
  <span class="mut" id="upd">Connecting...</span>
</div>
<div class="card set" id="set">
  <label>Starting balance ($)</label><input id="bal" type="number">
  <label>Risk per order (% of balance)</label><input id="risk" type="number" step="0.1">
  <label>Minimum score to place an order: <b id="mv"></b></label><input type="range" id="min" min="50" max="100" step="5">
  <label>Telegram bot token (optional)</label><input id="tg">
  <label>Telegram chat ID</label><input id="chat">
  <label>Anthropic API key for Master mode (optional, stays on this phone)</label><input id="akey" type="password" placeholder="sk-ant-...">
  <label>AI model</label><input id="amodel">
  <label>Voice character</label><select id="persona"></select>
  <div class="mut" id="pdesc"></div>
  <button id="prand">Surprise me</button>
  <label>Reply length</label><select id="bLen"><option value="short">Short</option><option value="normal">Normal</option><option value="detailed">Detailed</option></select>
  <label>Humor</label><select id="bHum"><option value="none">None</option><option value="some">Some</option><option value="lots">Lots</option></select>
  <label>Attitude</label><select id="bTough"><option value="gentle">Gentle</option><option value="balanced">Balanced</option><option value="tough">Tough love</option></select>
  <label>Energy</label><select id="bEn"><option value="calm">Calm</option><option value="normal">Normal</option><option value="high">High</option></select>
  <label>What should it call you?</label><input id="uname" placeholder="your name or nickname">
  <label>Voice</label><select id="vsel"></select>
  <label>Speech speed: <b id="rv"></b></label><input type="range" id="vrate" min="0.7" max="1.4" step="0.05">
  <label>Voice pitch: <b id="pv"></b></label><input type="range" id="vpitch" min="0.6" max="1.5" step="0.05">
  <label><input type="checkbox" id="vspeak">Speak replies out loud</label>
  <label><input type="checkbox" id="vhands">Hands-free: listen again after each reply</label>
  <button id="vtest">Test voice</button>
  <button id="test">Send test alert</button>
  <button id="reset">Clear all orders</button>
</div>
<div class="card" id="gate"></div>
<div class="card" id="sum"></div>
<div class="card"><h2>Orders</h2><div id="ords"></div></div>
<div class="card"><h2>Watching</h2><div id="watch"></div></div>
<div class="mut" style="margin-top:14px">Orders are simulated at the entry, stop and target the bot calculates. No real money is used. Scores count how many SMC conditions line up and are not a win probability. Not financial advice.</div>
<button id="deskbtn">Ask Desk Master</button>
<div id="deskpanel">
  <div class="chead"><b>Desk Master</b><span class="mut" id="cmode"></span><button id="cvoice" style="margin-left:auto;padding:5px 10px"></button><button id="cclose" style="padding:5px 12px">Close</button></div>
  <div id="cmsgs"></div>
  <div class="chips" id="cchips"></div>
  <div class="chips" id="cpchips"></div>
  <div class="crow"><input id="cin" placeholder="Ask about your setups, orders or SMC"><button id="cmic">Talk</button><button class="go" id="csend">Send</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
const SYMS=['BTCUSDT','ETHUSDT','SOLUSDT'],HOSTS=['api.binance.com','data-api.binance.vision','api.binance.us'];
const TF={'5m':3e5,'15m':9e5,'1h':36e5};
const S={tf:'15m',min:70,tg:'',chat:'',bal:1000,risk:1,orders:[],key:'',model:'claude-sonnet-5-5',persona:'friend',voice:'',rate:1,pitch:1,speak:true,hands:false,len:'normal',hum:'some',tough:'balanced',energy:'normal',uname:'',gate:{day:'',on:null,manual:false}},R={};
try{Object.assign(S,JSON.parse(localStorage.getItem('smcdesk')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('smcdesk',JSON.stringify(S))}catch(e){}};
const fx=v=>v.toFixed(v>1000?1:v>10?2:4),usd=v=>(v<0?'-$':'+$')+Math.abs(v).toFixed(2);
const cls=v=>v>=0?'pos':'neg';

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

async function klines(sym){
  let err;
  for(const h of HOSTS){
    try{
      const r=await fetch(`https://${h}/api/v3/klines?symbol=${sym}&interval=${S.tf}&limit=300`);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return (await r.json()).map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
    }catch(e){err=e}
  }
  throw err;
}
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
const atr=(c,n=14)=>{let s=0,q=0;for(let i=Math.max(1,c.length-n);i<c.length;i++){s+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c));q++}return s/q};
function piv(c,n=3){const H=[],L=[];for(let i=n;i<c.length-n;i++){let h=1,l=1;for(let j=1;j<=n;j++){if(c[i].h<=c[i-j].h||c[i].h<=c[i+j].h)h=0;if(c[i].l>=c[i-j].l||c[i].l>=c[i+j].l)l=0}if(h)H.push(i);if(l)L.push(i)}return{H,L}}
function scanLong(c,a){
  const n=c.length,{H,L}=piv(c);
  for(let s=n-1;s>=n-16;s--){
    const p=[...L].reverse().find(i=>i<s-2&&s-i<=60&&c[s].l<c[i].l&&c[s].c>c[i].l&&Math.min(...c.slice(i+1,s).map(x=>x.l))>=c[i].l);
    if(p===undefined)continue;
    const ph=[...H].reverse().find(i=>i<s);if(ph===undefined)continue;
    let d=-1;
    for(let i=s;i<Math.min(s+7,n);i++){if(c[i].c>c[i].o&&c[i].c-c[i].o>=0.8*a&&c[i].c>c[ph].h){d=i;break}}
    if(d<0)continue;
    let ob=-1;
    for(let i=d-1;i>=Math.max(0,s-4);i--){if(c[i].c<c[i].o){ob=i;break}}
    if(ob<0)continue;
    const lo=c[ob].l,hi=c[ob].h,en=(lo+hi)/2,sl=c[s].l-0.1*a;
    return{t:c[s].t,age:n-1-d,lvl:c[p].l,lo,hi,en,sl,tp:en+2*(en-sl)};
  }
  return null;
}
const mir=c=>c.map(x=>({t:x.t,o:-x.o,h:-x.l,l:-x.h,c:-x.c}));
function analyze(all){
  const c=all.slice(0,-1),px=all[all.length-1].c,a=atr(c);
  const cl=c.map(x=>x.c),e50=ema(cl,50).at(-1),e200=ema(cl,200).at(-1);
  const up=e50>e200&&px>e50,dn=e50<e200&&px<e50,h=new Date().getUTCHours(),found=[];
  const L=scanLong(c,a);if(L)found.push({dir:'LONG',...L});
  const m=scanLong(mir(c),a);
  if(m)found.push({dir:'SHORT',t:m.t,age:m.age,lvl:-m.lvl,lo:-m.hi,hi:-m.lo,en:-m.en,sl:-m.sl,tp:-m.tp});
  found.forEach(x=>{
    const lg=x.dir==='LONG';let sc=65;
    if(lg?up:dn)sc+=15;
    if((h>=7&&h<10)||(h>=12&&h<15))sc+=10;
    if((px>=x.lo&&px<=x.hi)||Math.abs(px-x.en)<=a*0.6)sc+=10;
    const prog=(lg?px-x.en:x.en-px)/Math.abs(x.en-x.sl);
    x.sc=sc;
    x.st=lg?(px<=x.sl?'INVALID':px>=x.tp?'DONE':prog>=1?'MISSED':px<=x.hi?'IN ZONE':'WAITING')
           :(px>=x.sl?'INVALID':px<=x.tp?'DONE':prog>=1?'MISSED':px>=x.lo?'IN ZONE':'WAITING');
    x.live=x.st==='IN ZONE'||x.st==='WAITING';
  });
  found.sort((p,q)=>(q.live-p.live)||(q.sc-p.sc)||(p.age-q.age));
  return{px,up,dn,sig:found[0]||null};
}

// ---- alerts ----
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(a.currentTime+.3)}catch(e){}}
function notify(title,body){
  beep();
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body})}catch(e){}
  if(S.tg&&S.chat)fetch(`https://api.telegram.org/bot${S.tg}/sendMessage?chat_id=${encodeURIComponent(S.chat)}&text=${encodeURIComponent(title+'\n'+body)}`).catch(()=>{});
}

// ---- simulated orders ----
function evalOrder(o,k,px){
  const lg=o.dir==='LONG',ev=[],cs=k.filter(x=>x.t>=o.created).concat([{t:Date.now(),h:px,l:px}]);
  for(const x of cs){
    if(o.st==='PENDING'){
      if(lg?x.l<=o.en:x.h>=o.en){o.st='OPEN';o.fillT=Date.now();ev.push('fill')}
      else if(lg?x.h>=o.tp:x.l<=o.tp){o.st='CANCELLED';o.closeT=Date.now();return ev}
      else if(Date.now()-o.created>12*TF[o.tf]){o.st='CANCELLED';o.closeT=Date.now();return ev}
    }
    if(o.st==='OPEN'){
      if(lg?x.l<=o.sl:x.h>=o.sl){o.st='LOSS';o.r=-1;o.closeT=Date.now();ev.push('loss');return ev}
      if(lg?x.h>=o.tp:x.l<=o.tp){o.st='WIN';o.r=o.rr;o.closeT=Date.now();ev.push('win');return ev}
    }
  }
  return ev;
}
function handle(sym,r,k){
  const name=sym.replace('USDT',''),x=r.sig;
  if(x&&x.live&&x.sc>=S.min&&gateOn()){
    const id=`${sym}|${S.tf}|${x.dir}|${x.t}`;
    if(!S.orders.some(o=>o.id===id)){
      S.orders.unshift({id,sym,tf:S.tf,dir:x.dir,en:x.en,sl:x.sl,tp:x.tp,rr:Math.abs(x.tp-x.en)/Math.abs(x.en-x.sl),sc:x.sc,risk:S.bal*S.risk/100,created:Date.now(),st:'PENDING'});
      notify(`${name} ${x.dir} order placed`,`Limit ${fx(x.en)}  SL ${fx(x.sl)}  TP ${fx(x.tp)}\nScore ${x.sc}/100`);
    }
  }
  manageOrders(sym,r,k);
}
function manageOrders(sym,r,k){
  const name=sym.replace('USDT','');
  for(const o of S.orders){
    if(o.sym!==sym||(o.st!=='PENDING'&&o.st!=='OPEN'))continue;
    for(const e of evalOrder(o,k,r.px)){
      if(e==='fill')notify(`${name} ${o.dir} filled`,`Entered at ${fx(o.en)}`);
      if(e==='win')notify(`${name} target hit`,`${usd(o.r*o.risk)} (+${o.rr.toFixed(1)}R)`);
      if(e==='loss')notify(`${name} stop hit`,`${usd(-o.risk)} (-1R)`);
    }
  }
  if(S.orders.length>200)S.orders.length=200;
  save();
}
const pnl=(o,px)=>{
  if(o.st==='WIN'||o.st==='LOSS')return o.r*o.risk;
  if(o.st==='OPEN'&&px){const lg=o.dir==='LONG';return((lg?px-o.en:o.en-px)/Math.abs(o.en-o.sl))*o.risk}
  return 0;
};
function spark(v){
  if(v.length<2)return '';
  const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*100).toFixed(1)},${(29-(y-mn)/r*28).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:46px;margin-top:8px"><polyline points="${pts}" fill="none" stroke="${v.at(-1)>=0?'#3ecf9a':'#ff6b6b'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function render(){
  const closed=S.orders.filter(o=>o.st==='WIN'||o.st==='LOSS').sort((a,b)=>a.closeT-b.closeT);
  const open=S.orders.filter(o=>o.st==='OPEN'),pend=S.orders.filter(o=>o.st==='PENDING');
  const cp=closed.reduce((s,o)=>s+o.r*o.risk,0),op=open.reduce((s,o)=>s+pnl(o,R[o.sym]?.px),0);
  const wins=closed.filter(o=>o.st==='WIN').length,wr=closed.length?Math.round(wins/closed.length*100)+'%':'none yet';
  let run=0;const curve=[0,...closed.map(o=>run+=o.r*o.risk)];
  $('#sum').innerHTML=`<div class="mut">Simulated balance</div><div class="big ${cls(cp+op)}">$${(S.bal+cp+op).toFixed(2)}</div>`
    +`<div class="grid"><div><small>Closed profit</small><b class="${cls(cp)}">${usd(cp)}</b></div><div><small>Open profit</small><b class="${cls(op)}">${usd(op)}</b></div><div><small>Win rate</small><b>${wr}</b></div>`
    +`<div><small>Open</small><b>${open.length}</b></div><div><small>Pending</small><b>${pend.length}</b></div><div><small>Closed</small><b>${closed.length}</b></div></div>`+spark(curve);
  const show=[...pend,...open,...closed.slice().reverse().slice(0,15)];
  $('#ords').innerHTML=show.length?show.map(o=>{
    const p=pnl(o,R[o.sym]?.px),done=o.st==='WIN'||o.st==='LOSS',rr=done?o.r:(o.st==='OPEN'?p/o.risk:0);
    return `<div class="ord"><div class="r1"><b>${o.sym.replace('USDT','')}</b><span class="pill ${o.dir}">${o.dir}</span><span class="st">${o.st==='PENDING'?'waiting to fill':o.st==='OPEN'?'in trade':o.st==='WIN'?'target hit':'stopped out'}</span>`
      +(o.st==='PENDING'?'':`<span class="pl ${cls(p)}">${usd(p)} <span class="mut">${rr>=0?'+':''}${rr.toFixed(1)}R</span></span>`)+`</div>`
      +`<div class="mut">Entry ${fx(o.en)}  Stop ${fx(o.sl)}  Target ${fx(o.tp)}  Score ${o.sc}  ${o.tf}</div></div>`}).join('')
    :'<div class="mut">No orders yet. The bot places one when a setup scores high enough.</div>';
  $('#watch').innerHTML=SYMS.map(s=>{
    const r=R[s],n=s.replace('USDT','');
    if(!r)return `<div class="ord mut">${n} loading...</div>`;
    if(r.err)return `<div class="ord mut">${n} could not load (${r.err}). Retrying.</div>`;
    const x=r.sig;
    return `<div class="ord"><div class="r1"><b>${n}</b><span>${fx(r.px)}</span><span class="mut" style="margin-left:auto">${r.up?'Trend up':r.dn?'Trend down':'No clear trend'}</span></div>`
      +`<div class="mut">${x?`${x.dir} setup, score ${x.sc}, ${x.st.toLowerCase()}`:'No setup. Waiting for a liquidity sweep.'}</div></div>`}).join('');
}
// ---- live feed (Binance WebSocket) ----
const K={},WSH=['stream.binance.com:9443','data-stream.binance.vision','stream.binance.us:9443'];
let ws=null,wsOk=false,retry=0,lastA={},rt=0;
function setLive(on){$('#upd').innerHTML=on?'<span class="pos">● Live</span>':'<span class="neg">● Reconnecting</span>'}
function draw(){if(rt)return;rt=setTimeout(()=>{rt=0;render()},400)}
async function loadAll(){
  for(const s of SYMS){
    try{K[s]=await klines(s);R[s]=analyze(K[s]);lastA[s]=Date.now();handle(s,R[s],K[s])}
    catch(e){if(!K[s])R[s]={err:e.message}}
  }
  render();
}
function onTick(s,closed){
  const k=K[s];if(!k)return;
  if(closed||!R[s]||R[s].err||Date.now()-(lastA[s]||0)>3000){lastA[s]=Date.now();R[s]=analyze(k);handle(s,R[s],k)}
  else{R[s].px=k[k.length-1].c;manageOrders(s,R[s],k)}
  draw();
}
function connect(){
  try{ws&&ws.close()}catch(e){}
  const st=SYMS.map(s=>`${s.toLowerCase()}@kline_${S.tf}`).join('/');
  const me=ws=new WebSocket(`wss://${WSH[retry%WSH.length]}/stream?streams=${st}`);
  me.onopen=()=>{wsOk=true;retry=0;setLive(true);loadAll()};
  me.onmessage=ev=>{
    try{
      const d=JSON.parse(ev.data).data,k=d.k,c=K[d.s];if(!c)return;
      const x={t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c},L=c[c.length-1];
      if(L.t===x.t)c[c.length-1]=x;else if(x.t>L.t){c.push(x);if(c.length>320)c.shift()}
      onTick(d.s,k.x);
    }catch(e){}
  };
  me.onclose=()=>{if(me!==ws)return;wsOk=false;setLive(false);retry++;setTimeout(connect,Math.min(1000*retry,10000))};
  me.onerror=()=>{try{me.close()}catch(e){}};
}
$('#tf').value=S.tf;$('#min').value=S.min;$('#mv').textContent=S.min;$('#tg').value=S.tg;$('#chat').value=S.chat;$('#bal').value=S.bal;$('#risk').value=S.risk;
$('#tf').onchange=e=>{S.tf=e.target.value;save();for(const k in R)delete R[k];for(const k in K)delete K[k];render();connect();loadAll()};
$('#min').oninput=e=>{S.min=+e.target.value;$('#mv').textContent=S.min;save()};
$('#tg').onchange=e=>{S.tg=e.target.value.trim();save()};
$('#chat').onchange=e=>{S.chat=e.target.value.trim();save()};
$('#bal').onchange=e=>{S.bal=+e.target.value||1000;save();render()};
$('#risk').onchange=e=>{S.risk=+e.target.value||1;save()};
$('#gear').onclick=()=>$('#set').classList.toggle('on');
$('#test').onclick=()=>notify('Test alert','Alerts are working.');
$('#reset').onclick=()=>{if(confirm('Clear all orders and results?')){S.orders=[];save();render()}};
$('#start').onclick=async()=>{
  try{if(window.Notification)await Notification.requestPermission()}catch(e){}
  try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}
  beep();$('#start').textContent='Alerts on';
};

function localAnswer(q){
  const t=q.toLowerCase();
  if(/should i (buy|sell|take|trade|enter)|worth it|good trade|will it (win|work)/.test(t))
    return "I cannot predict the market or tell you to take a trade. A cleaner checklist: score 80 or more, trend agrees, inside a killzone, price actually at the zone, and you risk only about 1% of your balance. Judge it on paper results first.";
  if(!/what is|what are|what\u2019s|define|meaning/.test(t)&&/my orders|open order|pending order|closed order|profit|balance|how am i|win rate|pnl|doing/.test(t)){
    const s=stats();
    return `Balance $${(S.bal+s.cp+s.opn).toFixed(2)}. Closed profit ${usd(s.cp)}, open profit ${usd(s.opn)}.\n${s.cl.length?`Win rate ${Math.round(s.w/s.cl.length*100)}% over ${s.cl.length} closed orders.`:'No closed orders yet.'} ${s.op.length} in trade, ${s.pend} waiting to fill.`;

}

    +`<div class="bar" style="margin:0"><button class="${g===true?'go':''}" id="gon">Trade today</button><button class="${g===false?'go':''}" id="goff">No trade today</button></div>`;
  if(el.dataset.h===h)return;
  el.dataset.h=h;el.innerHTML=h;
  $('#gon').onclick=()=>setGate(true,true);$('#goff').onclick=()=>setGate(false,true);
}
// follow the Telegram bot choice for today, unless you set it by hand in the app
async function syncBot(){
  try{
    const r=await fetch('state.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const t=(await r.json()).today;
    if(!t||typeof t.on!=='boolean'||t.day!==tday())return;
    if(S.gate&&S.gate.day===tday()&&(S.gate.manual||S.gate.on===t.on))return;
    setGate(t.on,false);
  }catch(e){}
}
renderGate();syncBot();
setInterval(()=>{syncBot();renderGate()},60000);
</script></body></html>
